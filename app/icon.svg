<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="black"/>

  <!-- Long rays — cardinal directions -->
  <line x1="50" y1="24" x2="50" y2="3"  stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(0,   50, 50)"/>
  <line x1="50" y1="24" x2="50" y2="3"  stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(90,  50, 50)"/>
  <line x1="50" y1="24" x2="50" y2="3"  stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(180, 50, 50)"/>
  <line x1="50" y1="24" x2="50" y2="3"  stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(270, 50, 50)"/>

  <!-- Short rays — in between -->
  <line x1="50" y1="24" x2="50" y2="13" stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(30,  50, 50)"/>
  <line x1="50" y1="24" x2="50" y2="13" stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(60,  50, 50)"/>
  <line x1="50" y1="24" x2="50" y2="13" stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(120, 50, 50)"/>
  <line x1="50" y1="24" x2="50" y2="13" stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(150, 50, 50)"/>
  <line x1="50" y1="24" x2="50" y2="13" stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(210, 50, 50)"/>
  <line x1="50" y1="24" x2="50" y2="13" stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(240, 50, 50)"/>
  <line x1="50" y1="24" x2="50" y2="13" stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(300, 50, 50)"/>
  <line x1="50" y1="24" x2="50" y2="13" stroke="white" stroke-width="2.8" stroke-linecap="round" transform="rotate(330, 50, 50)"/>

  <!-- Circle -->
  <circle cx="50" cy="50" r="21" fill="black" stroke="white" stroke-width="2.8"/>

  <!-- CS -->
  <text x="50" y="56" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial, Helvetica, sans-serif">CS</text>
</svg>
